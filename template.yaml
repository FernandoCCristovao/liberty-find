AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Liberty Find. Coleta diária de APIs públicas de ATS, dados no S3, consulta no Athena.
  Arquitetura em docs/arquitetura.md; operação em docs/operacao.md. Este template do SAM
  vale até a migração para Terraform (Marco 1, tarefa 1.2; ADR 0016).

Parameters:
  AlertEmail:
    Type: String
    Description: E-mail que recebe o alerta quando a coleta diária falha
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  CollectSchedule:
    Type: String
    Default: cron(0 6 * * ? *)
    Description: Horário da coleta diária, no fuso America/Sao_Paulo
  AthenaBytesScannedCutoff:
    Type: Number
    Default: 1073741824
    MinValue: 10485760
    Description: Limite de bytes lidos por consulta no workgroup (1 GB por padrão)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 300
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        BUCKET_NAME: !Ref DataBucket
        POWERTOOLS_SERVICE_NAME: liberty-find
        POWERTOOLS_LOG_LEVEL: INFO
    Tags:
      project: liberty-find

Resources:
  # --- Armazenamento -------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expira-bruto
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: expira-resultados-athena
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
      Tags:
        - Key: project
          Value: liberty-find

  # --- Coleta diária ------------------------------------------------------------------
  CollectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Coleta diária das vagas nas APIs públicas de ATS
      CodeUri: src/
      Handler: liberty_find.handlers.collect.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
      Events:
        Diario:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref CollectSchedule
            ScheduleExpressionTimezone: America/Sao_Paulo
            RetryPolicy:
              MaximumRetryAttempts: 1

  CollectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CollectFunction}
      RetentionInDays: 30

  # --- Alerta de falha ----------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  CollectErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A coleta diária do Liberty Find falhou
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # --- Catálogo e consulta (Athena) ---------------------------------------------------
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: liberty_find
        Description: Tabelas do Liberty Find (contratos em docs/dados/contratos.md)

  PostingsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: postings
        Description: Vagas abertas em cada dia, uma linha por vaga e dia de coleta
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: 2026-10-01,NOW
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${DataBucket}/postings/dt=${!dt}/
        PartitionKeys:
          - Name: dt
            Type: string
        StorageDescriptor:
          Location: !Sub s3://${DataBucket}/postings/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          Columns:
            - { Name: posting_id, Type: string }
            - { Name: source, Type: string }
            - { Name: board, Type: string }
            - { Name: company, Type: string }
            - { Name: source_job_id, Type: string }
            - { Name: title, Type: string }
            - { Name: url, Type: string }
            - { Name: location, Type: string }
            - { Name: workplace_type, Type: string }
            - { Name: country, Type: string }
            - { Name: department, Type: string }
            - { Name: language, Type: string }
            - { Name: description_text, Type: string }
            - { Name: content_hash, Type: string }
            - { Name: published_at, Type: string }
            - { Name: updated_at, Type: string }
            - { Name: collected_at, Type: string }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: liberty-find
      Description: Consultas do Liberty Find, com limite de bytes lidos por consulta
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: !Ref AthenaBytesScannedCutoff
        ResultConfiguration:
          OutputLocation: !Sub s3://${DataBucket}/athena-results/

Outputs:
  BucketName:
    Description: Bucket com bruto, vagas e relatórios de saúde
    Value: !Ref DataBucket
  CollectFunctionName:
    Description: Lambda de coleta (para invocar à mão no primeiro teste)
    Value: !Ref CollectFunction
  GlueDatabaseName:
    Value: !Ref GlueDatabase
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
